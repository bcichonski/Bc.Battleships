name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: Backend (build, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Bc.Battleships.slnx

      # Release configuration: the Debug-only npm install target of the web project does not run.
      - name: Build
        run: dotnet build Bc.Battleships.slnx -c Release --no-restore

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      # Runs the tests on the existing Release build and writes the report; low coverage is a warning annotation.
      - name: Test and coverage
        run: bash scripts/coverage.sh -c Release --no-build

      - name: Publish coverage summary
        if: always()
        run: |
          [ -f CoverageReport/SummaryGithub.md ] && cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: CoverageReport

  client:
    name: Client (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Bc.Battleships/ClientApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Bc.Battleships/ClientApp/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Includes the tsc typecheck.
      - run: npm run build
      - run: npm test

  e2e:
    name: Client e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Bc.Battleships/ClientApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Bc.Battleships/ClientApp/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Playwright starts the backend (throw-away SQLite database) and the Vite dev server itself.
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/Bc.Battleships/ClientApp/playwright-report

  docker:
    name: Docker image (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bc-battleships .
